name: Build

# Every push and pull request builds and smoke-tests the binary.
# Pushing a tag like v1.0.0 also publishes a GitHub release with the binary attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The oldest available runner, so the binary links against an older glibc
    # and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install the app and PyInstaller
        run: pip install . "pyinstaller>=6.10,<7"

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import ps5hwcon; print(ps5hwcon.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ps5hwcon.__version__ ($version)"
            exit 1
          fi

      - name: Build the binary
        run: packaging/build_binary.sh

      - name: Smoke-test the binary
        run: |
          # The runner has no PS5 hardware, so the app only logs missing interfaces.
          # Each mode should still be running after 10 s; timeout's exit code 124 means it was.
          export PS5HWCON_SETTINGS_DIR="$RUNNER_TEMP/settings-headless"
          status=0
          timeout 10 dist/ps5-hwcon-gui --headless > headless.log 2>&1 || status=$?
          cat headless.log
          [ "$status" -eq 124 ] || { echo "::error::Headless mode exited early ($status)"; exit 1; }
          grep -q "backend starting" headless.log

          export PS5HWCON_SETTINGS_DIR="$RUNNER_TEMP/settings-gui"
          status=0
          QT_QPA_PLATFORM=offscreen timeout 10 dist/ps5-hwcon-gui > gui.log 2>&1 || status=$?
          cat gui.log
          [ "$status" -eq 124 ] || { echo "::error::The window exited early ($status)"; exit 1; }

      - name: Package
        run: |
          mkdir -p release
          cp dist/ps5-hwcon-gui release/ps5-hwcon-gui-linux-x86_64
          cd release
          sha256sum ps5-hwcon-gui-linux-x86_64 > ps5-hwcon-gui-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ps5-hwcon-gui-linux-x86_64
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps5-hwcon-gui-linux-x86_64
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
